<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선으로 그린 말 · 線馬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: #f6f1df; color: #2a2622; font-family: "Noto Serif KR", serif; font-weight: 300; overflow: hidden; }
  a.back { position: fixed; top: 14px; left: 14px; z-index: 5; font-size: 13px; color: #2a2622; text-decoration: none; border-bottom: 1px solid #2a2622; }
  #stage { position: fixed; inset: 0; display: grid; gap: 0; place-items: center; cursor: pointer; padding: 44px 12px 86px; }
  #stage { grid-auto-rows: minmax(0, 1fr); }
  .cell { position: relative; width: 100%; height: 100%; min-width: 0; min-height: 0; }
  .cell svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #tools { position: fixed; left: 0; right: 0; bottom: 40px; z-index: 6; display: flex; justify-content: center; gap: 12px; pointer-events: none; }
  #tools button { pointer-events: auto; min-width: 116px; font: 13px/1 "Noto Serif KR", serif; background: rgba(246,241,223,.92); color: #2a2622; border: 1px solid #2a2622; padding: 9px 14px; cursor: pointer; transition: background .2s, color .2s; }
  #tools button.on { background: #a8321e; border-color: #a8321e; color: #fff; }
  #cap { position: fixed; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 12.5px; color: #7a6f62; pointer-events: none; }
  .hd { stroke-dasharray: 1; stroke-dashoffset: 1; animation: hd .5s ease-out forwards; }
  @keyframes hd { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .hd { animation: none; stroke-dashoffset: 0; } }
</style>
</head>
<body>
<a class="back" href="../">← 山水·非花</a>
<div id="stage" title="클릭하면 새 말"></div>
<div id="cap"></div>
<div id="tools"><button id="runbtn" type="button">달리기 ▶</button><button id="wcbtn" type="button">수채 채색</button></div>
<!-- p5.brush 2.2.3 standalone build (MIT, Alejandro Campos Uribe): watercolor fills -->
<script src="../vendor/p5.brush/dist/brush.js"></script>
<script src="../shared/panel.js"></script>
<script src="horsedraw.js"></script>
<script>
(function () {
  const DEFAULTS = { seed: '', build: 'auto', pose: 'auto', coat: 'auto', mane: -1, wobble: 1, stroke: 1.3, count: 1, animate: true, ink: '#1d1a17', paper: '#f6f1df',
                     color: false, palette: 'any', wcOpacity: 120, wcBleed: 0.25, wcTexture: 0.5, bgWash: true, run: false, fps: 14 };
  const V = readQuery(DEFAULTS);
  if (!V.seed) V.seed = String(Math.floor(Math.random() * 1e6));
  const stage = document.getElementById('stage'), cap = document.getElementById('cap');
  const KO = { light: '경주마', stock: '보통 말', draft: '짐말', pony: '조랑말', foal: '망아지',
               run: '달리는 중', stand: '서 있음', walk: '걷기', trot: '속보', gallop: '질주', rear: '앞발 들기', graze: '풀 뜯기',
               plain: '민무늬', shade: '음영', pinto: '얼룩', dapple: '연전', zebra: '줄무늬' };
  let last = [], unders = [], token = 0, timer = 0, cur = 0;
  const seedOf = (i) => V.seed + (i ? '-' + i : '');

  // ---------- random palette ----------
  function rng(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h |= 0; h = h + 0x6D2B79F5 | 0; let t = Math.imul(h ^ h >>> 15, 1 | h); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function hsl(h, s, l) { h = ((h % 360) + 360) % 360; s /= 100; l /= 100; const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l); const f = (n) => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)))).toString(16).padStart(2, '0'); return '#' + f(0) + f(8) + f(4); }
  const NATURAL = [   // body, patch, mane/tail, legs
    ['#a8623a', '#7d4526', '#2b2320', '#3a2c26'],   // 밤색 (bay)
    ['#b5683c', '#d18b55', '#c98a52', '#b5683c'],   // 구렁말 (chestnut)
    ['#d9b36c', '#e8cf9a', '#f3ead6', '#cfa862'],   // 팔로미노
    ['#9aa0a6', '#c9ccd0', '#5d6166', '#6f757b'],   // 회색
    ['#3a3532', '#59504a', '#1f1c1a', '#2b2725'],   // 가라말 (black)
    ['#c9a878', '#a98658', '#3b2f28', '#4a3b31'],   // 황부루 (dun)
    ['#e9e2d2', '#8a5a3c', '#d8cdb8', '#d9d0bd'],   // 얼룩 바탕
  ];
  function palette(seed) {
    const R = rng('pal' + seed), mode = V.palette === 'any' ? (R() < 0.45 ? 'natural' : 'wild') : V.palette;
    if (mode === 'natural') { const n = NATURAL[Math.floor(R() * NATURAL.length)]; return { body: n[0], patch: n[1], hair: n[2], legs: n[3], hoof: '#4a4541', bg: hsl(R() * 360, 35, 78) }; }
    const h = R() * 360, d = [30, 60, 150, 180, 210][Math.floor(R() * 5)] * (R() < 0.5 ? -1 : 1);
    return { body: hsl(h, 55 + R() * 30, 52 + R() * 16), patch: hsl(h + d * 0.5, 60 + R() * 25, 45 + R() * 20), hair: hsl(h + d, 60 + R() * 30, 35 + R() * 30),
             legs: hsl(h + (R() < 0.5 ? 0 : d), 50 + R() * 30, 35 + R() * 20), hoof: hsl(h + d, 25, 28), bg: hsl(h + 180 + (R() - 0.5) * 80, 45, 80) };
  }

  // ---------- watercolor underpainting (p5.brush) ----------
  const WS = 1.5, wc = document.createElement('canvas'); wc.width = 800 * WS; wc.height = 600 * WS;
  function paintHorse(res, seed) {
    const R = rng('wc' + seed), C = palette(seed), g = res.regions, K = (poly) => poly.map((p) => [p[0] * WS, p[1] * WS]);
    const blob = (x, y, r, n) => { const out = [], ph = R() * 9; n = n || 14; for (let i = 0; i < n; i++) { const a = i / n * 6.283, rr = r * (0.7 + 0.5 * R()); out.push([(x + Math.cos(a + ph) * rr * 1.25) * WS, (y + Math.sin(a + ph) * rr) * WS]); } return out; };
    let n = 0; for (const c of seed) n = n * 31 + c.charCodeAt(0) | 0;
    brush.seed(n); brush.noiseSeed(n + 7);
    brush.load(wc); brush.clear(); brush.push(); brush.translate(-wc.width / 2, -wc.height / 2);
    brush.noStroke(); brush.noField();
    brush.fillBleed(V.wcBleed); brush.fillTexture(V.wcTexture, 0.5);
    const op = V.wcOpacity;
    if (V.bgWash) {
      const b = g.body.reduce((a, p) => [a[0] + p[0], a[1] + p[1]], [0, 0]).map((v) => v / g.body.length);
      brush.fill(C.bg, op * 0.5); brush.polygon(blob(b[0], b[1], 150 * g.scale + 60));
      if (R() < 0.6) { brush.fill(C.bg, op * 0.4); brush.polygon(blob(b[0] + (R() - 0.5) * 200, b[1] + 120 * g.scale, 90)); }
    }
    for (const lg of g.legs) if (lg.far) { brush.fill(C.legs, op * 0.9); brush.polygon(K(lg.poly)); }
    if (g.tail.length > 2) { brush.fill(C.hair, op * 0.95); brush.polygon(K(g.tail)); }
    brush.fill(C.body, op); brush.polygon(K(g.body));
    for (const lg of g.legs) if (!lg.far) { brush.fill(R() < 0.5 ? C.legs : C.body, op * 0.8); brush.polygon(K(lg.poly)); }
    for (const [x, y, r] of g.blobs.slice(0, 3)) if (R() < 0.75) { brush.fill(C.patch, op * 0.7); brush.polygon(blob(x, y, r * (0.7 + R() * 0.7), 10)); }
    if (g.mane) { brush.fill(C.hair, op * 0.95); brush.polygon(K(g.mane)); }
    brush.fill(C.hoof, op); for (const h of g.hooves) brush.polygon(K(h));
    brush.noFill(); brush.pop(); brush.render();
    return wc.toDataURL('image/png');
  }

  function render() {
    const n = +V.count, tall = innerHeight > innerWidth * 1.15, cols = n === 1 ? 1 : tall ? (n <= 4 ? 1 : 2) : n <= 4 ? 2 : 3;
    stage.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    document.body.style.background = V.paper;
    last = []; unders = []; let html = ''; const my = ++token;
    clearInterval(timer); cur = 0;
    const NF = V.run ? (n > 4 ? 8 : 12) : 1;
    for (let i = 0; i < n; i++) {
      const fr = []; html += '<div class="cell">';
      for (let f = 0; f < NF; f++) {
        const res = horsedraw({ seed: seedOf(i), build: V.build, pose: V.run ? 'run' : V.pose, phase: f / NF, coat: V.coat, mane: V.mane < 0 ? null : V.mane, wobble: V.wobble });
        fr.push(res);
        html += horsedraw.toSVG(res, { ink: V.ink, paper: V.paper, stroke: V.stroke, animate: V.animate && !V.run ? 1.6 : 0 }).replace('<svg ', f ? '<svg style="visibility:hidden" ' : '<svg ');
      }
      last.push(fr); unders.push([]); html += '</div>';
    }
    stage.innerHTML = html;
    const cells = [...stage.children].map((c) => [...c.children]);
    if (V.run) timer = setInterval(() => {
      const nx = (cur + 1) % NF;
      for (const c of cells) { c[nx].style.visibility = 'visible'; c[cur].style.visibility = 'hidden'; }
      cur = nx;
    }, 1000 / V.fps);
    const f = last[0][0].info;
    cap.textContent = n === 1 ? `시드 ${V.seed} · ${KO[f.build]} · ${KO[f.pose]} · ${KO[f.coat]}` : `시드 ${V.seed} · ${n}마리`;
    writeQuery(V, DEFAULTS);
    if (V.color) {            // paint after the lines are on screen, one frame at a time
      const jobs = []; for (let fi = 0; fi < NF; fi++) for (let i = 0; i < n; i++) jobs.push([i, fi]);
      const step = (k) => {
        if (my !== token) return;
        if (k >= jobs.length) { panel && panel.busy(''); return; }
        panel && panel.busy(`수채 물감을 칠하는 중… ${k + 1}/${jobs.length}`);
        setTimeout(() => {
          if (my !== token) return;
          const [i, fi] = jobs[k];
          try {
            const url = paintHorse(last[i][fi], seedOf(i)); unders[i][fi] = url;
            const im = document.createElementNS('http://www.w3.org/2000/svg', 'image');
            im.setAttribute('href', url); im.setAttribute('width', 800); im.setAttribute('height', 600);
            im.style.mixBlendMode = 'multiply';
            if (!V.run) { im.style.opacity = 0; im.style.transition = 'opacity .8s'; requestAnimationFrame(() => { im.style.opacity = 1; }); }
            cells[i][fi].insertBefore(im, cells[i][fi].querySelector('g'));
          } catch (e) { console.error(e); }
          step(k + 1);
        }, 20);
      };
      step(0);
    }
  }
  function newSeed() { V.seed = String(Math.floor(Math.random() * 1e6)); panel.set('seed', V.seed); render(); }
  function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
  function fullSVG() { return horsedraw.toSVG(last[0][cur], { ink: V.ink, paper: V.paper, stroke: V.stroke, under: V.color ? unders[0][cur] : null }); }

  const opts = (keys) => [['auto', '무작위']].concat(keys.map((k) => [k, KO[k]]));
  var panel = makePanel({
    title: '線馬 · 파라미터', values: V,
    groups: [
      { name: '시드', items: [{ key: 'seed', label: '시드', type: 'text' }] },
      { name: '말', items: [
        { key: 'build', label: '체형', type: 'select', options: opts(['light', 'stock', 'draft', 'pony', 'foal']) },
        { key: 'pose', label: '자세', type: 'select', options: opts(['stand', 'walk', 'trot', 'gallop', 'rear', 'graze']) },
        { key: 'coat', label: '무늬', type: 'select', options: opts(['plain', 'shade', 'pinto', 'dapple', 'zebra']) },
        { key: 'mane', label: '갈기 길이', type: 'range', min: -1, max: 1.6, step: 0.05, fmt: (v) => v < 0 ? '무작위' : v.toFixed(2) },
      ] },
      { name: '선', items: [
        { key: 'wobble', label: '손떨림', type: 'range', min: 0, max: 3, step: 0.05 },
        { key: 'stroke', label: '선 굵기', type: 'range', min: 0.5, max: 3, step: 0.1 },
        { key: 'ink', label: '먹색', type: 'color' },
        { key: 'paper', label: '종이색', type: 'color' },
        { key: 'animate', label: '그리는 과정 보기', type: 'check' },
      ] },
      { name: '달리기', hint: '켜면 같은 말이 제자리에서 달립니다. 자세 설정은 무시됩니다.', items: [
        { key: 'run', label: '달리는 모션', type: 'check' },
        { key: 'fps', label: '빠르기', type: 'range', min: 4, max: 30, step: 1 },
      ] },
      { name: '수채 채색 (p5.brush)', hint: '시드마다 물감 색이 무작위로 정해집니다.', items: [
        { key: 'color', label: '채색', type: 'check' },
        { key: 'palette', label: '색', type: 'select', options: [['any', '무작위'], ['natural', '실제 말 색'], ['wild', '상상의 색']] },
        { key: 'wcOpacity', label: '물감 농도', type: 'range', min: 30, max: 220, step: 5 },
        { key: 'wcBleed', label: '번짐', type: 'range', min: 0, max: 0.6, step: 0.01 },
        { key: 'wcTexture', label: '물자국', type: 'range', min: 0, max: 1, step: 0.05 },
        { key: 'bgWash', label: '배경 번짐', type: 'check' },
      ] },
      { name: '화면', items: [{ key: 'count', label: '마리 수', type: 'select', numeric: true, options: [[1, '1'], [4, '4'], [6, '6'], [9, '9']] }] },
    ],
    onChange: (key, val, all, done) => { V[key] = val; if (key === 'color' || key === 'run') syncBtn(); if (['wcOpacity', 'wcBleed', 'wcTexture'].includes(key) && !done) return; render(); },
    actions: [
      { label: '새 말', primary: true, onClick: newSeed },
      { label: 'SVG 저장', onClick: () => download(`horse-${V.seed}.svg`, new Blob([fullSVG()], { type: 'image/svg+xml' })) },
      { label: 'PNG 저장', onClick: () => {
        const img = new Image();
        img.onload = () => { const c = document.createElement('canvas'); c.width = 1600; c.height = 1200; c.getContext('2d').drawImage(img, 0, 0, 1600, 1200); c.toBlob((b) => download(`horse-${V.seed}.png`, b)); };
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(fullSVG());
      } },
    ],
    credit: '말 생성 코드(horsedraw.js)는 이 사이트에서 새로 쓴 것입니다. 선으로만 그리는 방식은 Lingdong Huang의 <a href="https://github.com/LingDong-/fishdraw">fishdraw</a>에서 착안했습니다.<br>수채: <a href="https://github.com/acamposuribe/p5.brush">p5.brush</a> 2.2.3 (Alejandro Campos Uribe, MIT)',
  });
  const wcbtn = document.getElementById('wcbtn');
  const runbtn = document.getElementById('runbtn');
  const syncBtn = () => { wcbtn.classList.toggle('on', !!V.color); wcbtn.textContent = V.color ? '수채 채색 켜짐' : '수채 채색'; runbtn.classList.toggle('on', !!V.run); runbtn.textContent = V.run ? '달리는 중 ■' : '달리기 ▶'; };
  runbtn.onclick = () => { V.run = !V.run; panel.set('run', V.run); syncBtn(); render(); };
  wcbtn.onclick = () => { V.color = !V.color; panel.set('color', V.color); syncBtn(); render(); };
  syncBtn();
  addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(render, 200); });
  stage.addEventListener('click', newSeed);
  addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); newSeed(); } });
  render();
})();
</script>
</body>
</html>
